
name: Build Tabakhati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tabakhati-source.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q Tabakhati-source.zip -d source
          GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLE_FILE"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabakhati-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
